                        "on-background": "#e0e3e5",

                        "surface-dim": "#101416",

                        "on-tertiary-fixed-variant": "#852400",
                        "on-tertiary-container": "#a22e00",
                        "on-primary": "#213600",
                        "surface-variant": "#313538",
                        "error-container": "#93000a",
                        "outline": "#8c947d",
                        "outline-variant": "#424937",
                        "secondary-fixed-dim": "#c2c7cb",

                        "secondary-container": "#42474b",

                    },
                    "borderRadius": {

                    },
                    "fontFamily": {

<style>
        .brutalist-border {
            border: 1px solid var(--tw-colors-outline-variant);
        }
        .brutalist-input:focus {
            border-color: var(--tw-colors-primary-container);
            outline: none;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center font-body-md selection:bg-primary-container selection:text-on-primary-container">
<div class="w-full max-w-[1440px] h-screen md:h-auto min-h-[800px] flex flex-col md:flex-row brutalist-border bg-surface-container-low mx-auto">
<!-- Left Side: Branding & Features -->
<div class="w-full md:w-1/2 p-xl flex flex-col justify-between border-b md:border-b-0 md:border-r border-outline-variant relative overflow-hidden bg-background">
<!-- Decorative geometric element -->
<div class="absolute top-0 right-0 w-64 h-64 bg-primary-container/5 rounded-bl-full pointer-events-none"></div>
<div class="z-10 relative">
<div class="text-headline-xl font-headline-xl text-primary tracking-tighter mb-xl">
                    DUB_STUDIO
                </div>
<h1 class="text-headline-lg font-headline-lg mb-lg max-w-sm">
                    Lồng tiếng Việt cho video bài giảng
                </h1>
<ul class="space-y-md text-body-lg font-body-lg text-on-surface-variant">
<li class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="mic">mic</span>
                        Chất lượng phòng thu
                    </li>
<li class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="bolt">bolt</span>
                        Xử lý siêu tốc
                    </li>
<li class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="translate">translate</span>
                        Hỗ trợ đa ngôn ngữ
                    </li>
</ul>
</div>
<div class="z-10 relative mt-xl">
<div class="inline-flex items-center gap-sm bg-surface-container-high px-md py-sm border border-outline-variant">
<span class="material-symbols-outlined text-primary text-[18px]" data-icon="speed">speed</span>
<span class="text-label-sm font-label-sm uppercase tracking-wider text-on-surface">Video 86 giây → xong trong 13 giây</span>
</div>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 p-xl flex flex-col justify-center bg-surface-container-low">
<div class="max-w-md w-full mx-auto">
<!-- Tabs -->
<div class="flex border-b border-outline-variant mb-xl">
<button class="w-1/2 pb-sm text-headline-md font-headline-md text-primary border-b-2 border-primary text-left">
                        Đăng nhập
                    </button>
<button class="w-1/2 pb-sm text-headline-md font-headline-md text-on-surface-variant hover:text-on-surface transition-colors text-left border-b-2 border-transparent">
                        Đăng ký
                    </button>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- Username Input -->
<div class="space-y-xs">
<label class="block text-label-sm font-label-sm uppercase text-on-surface-variant" for="username">Tên đăng nhập</label>
<input class="w-full bg-background brutalist-border px-md py-sm text-body-md font-body-md text-on-surface brutalist-input transition-colors rounded-none placeholder-outline" id="username" placeholder="Nhập tên đăng nhập" type="text">
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="block text-label-sm font-label-sm uppercase text-on-surface-variant flex justify-between" for="password">
                            Mật khẩu
                            <a class="text-primary hover:underline lowercase normal-case" href="#">Quên mật khẩu?</a>
</label>
<div class="relative">
<input class="w-full bg-background brutalist-border px-md py-sm pr-xl text-body-md font-body-md text-on-surface brutalist-input transition-colors rounded-none placeholder-outline" id="password" placeholder="Nhập mật khẩu" type="password">
<button aria-label="Toggle password visibility" class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface flex items-center justify-center h-full px-sm" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-black text-body-lg font-headline-md py-md mt-md hover:bg-primary transition-colors flex justify-center items-center gap-sm rounded-none border border-transparent hover:border-primary-fixed" type="submit">
                        Đăng nhập
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-lg text-center text-label-sm font-label-sm text-on-surface-variant">
                    Bằng việc đăng nhập, bạn đồng ý với <a class="text-primary hover:underline" href="#">Điều khoản</a> &amp; <a class="text-primary hover:underline" href="#">Bảo mật</a> của DUB_STUDIO.
                </div>
</div>
</div>
</div>
<script>
        // Simple password toggle logic for atmospheric interactivity
        const passwordInput = document.getElementById('password');
        const toggleButton = document.querySelector('[aria-label="Toggle password visibility"] span');
        
        document.querySelector('[aria-label="Toggle password visibility"]').addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleButton.textContent = 'visibility';
                toggleButton.setAttribute('data-icon', 'visibility');
            } else {
                passwordInput.type = 'password';
                toggleButton.textContent = 'visibility_off';
                toggleButton.setAttribute('data-icon', 'visibility_off');
            }
        });
    </script>
</body></html>
