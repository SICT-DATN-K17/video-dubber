name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài phụ thuộc
        # Bộ test không chạm tới GPU nên bỏ qua stack ML nặng (torch, whisper,
        # transformers) — cài đủ chúng sẽ mất vài GB và hơn mười phút.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Kiểm tra migration chạy sạch trên DB trống
        env:
          DATABASE_URL: sqlite:///ci.db
        run: flask --app wsgi db upgrade

      - name: Chạy test
        run: pytest
